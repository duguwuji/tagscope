# Deploy the TagScope web UI to Cloudflare Workers:  npx wrangler deploy
name = "tagscope"
main = "worker.js"
compatibility_date = "2025-10-01"
workers_dev = false
routes = [{ pattern = "tagscope.iotrfid.top", custom_domain = true }]

[[rules]]
type = "Text"
globs = ["**/*.html", "public/*.js"]
fallthrough = true
