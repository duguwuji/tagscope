name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 版本递增提交由 GITHUB_TOKEN 推送，GitHub 不会自动触发工作流；
  # version-bump.yml 在推送后显式派发一次，保证递增提交也有 CI 结果。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax and tests
        run: npm test
